<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Clone — Demo Store</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, 'Segoe UI', sans-serif; }
  body { background:#eaeded; color:#0f1111; }
  header.top { background:#131921; color:#fff; display:flex; align-items:center; gap:14px; padding:8px 16px; position:sticky; top:0; z-index:40; flex-wrap:wrap; }
  .logo { font-size:23px; font-weight:800; letter-spacing:-.5px; cursor:pointer; }
  .logo span { color:#ff9900; }
  .deliver { font-size:12px; color:#ccc; line-height:1.25; cursor:pointer; }
  .deliver b { color:#fff; font-size:13.5px; }
  .searchbar { flex:1; display:flex; min-width:240px; }
  .searchbar select { border:none; background:#f3f3f3; border-radius:6px 0 0 6px; padding:0 8px; font-size:12.5px; border-right:1px solid #ddd; }
  .searchbar input { flex:1; border:none; padding:11px 12px; font-size:15px; outline:none; }
  .searchbar button { border:none; background:#febd69; width:48px; border-radius:0 6px 6px 0; font-size:18px; cursor:pointer; }
  .searchbar button:hover { background:#f3a847; }
  .hlink { font-size:12px; color:#fff; line-height:1.25; cursor:pointer; white-space:nowrap; }
  .hlink b { font-size:13.5px; }
  .cart { position:relative; font-size:30px; cursor:pointer; background:none; border:none; color:#fff; }
  .cart b { position:absolute; top:-4px; left:50%; transform:translateX(-50%); color:#f08804; font-size:16px; }
  nav.sub { background:#232f3e; color:#fff; display:flex; gap:4px; padding:5px 12px; overflow-x:auto; }
  nav.sub button { background:none; border:none; color:#fff; font-size:13.5px; padding:6px 10px; border-radius:3px; cursor:pointer; white-space:nowrap; }
  nav.sub button:hover, nav.sub button.on { outline:1px solid #fff; }
  .hero { height:230px; background:linear-gradient(180deg,#7fb3d5 0%, #aed6f1 45%, rgba(234,237,237,0) 100%), url('https://picsum.photos/seed/amazonhero/1600/500') center/cover; display:flex; align-items:flex-start; justify-content:center; padding-top:26px; }
  .hero h1 { background:rgba(255,255,255,.92); padding:12px 26px; border-radius:6px; font-size:clamp(18px,3.4vw,30px); }
  .hero h1 span { color:#b12704; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; max-width:1240px; margin:-70px auto 10px; padding:0 14px; position:relative; }
  .p-card { background:#fff; padding:16px; display:flex; flex-direction:column; gap:7px; border-radius:4px; }
  .p-card img { width:100%; height:190px; object-fit:cover; border-radius:4px; cursor:pointer; }
  .p-card h3 { font-size:15px; font-weight:600; line-height:1.3; cursor:pointer; }
  .p-card h3:hover { color:#c7511f; }
  .stars { color:#ffa41c; font-size:14px; }
  .stars small { color:#007185; margin-left:5px; }
  .price { font-size:21px; font-weight:700; }
  .price sup { font-size:12px; }
  .was { color:#565959; font-size:12.5px; text-decoration:line-through; }
  .prime { color:#00a8e1; font-weight:700; font-size:12.5px; font-style:italic; }
  .p-card button { margin-top:auto; background:#ffd814; border:1px solid #fcd200; border-radius:20px; padding:8px; font-size:13.5px; cursor:pointer; }
  .p-card button:hover { background:#f7ca00; }
  .drawer { position:fixed; top:0; right:-360px; width:350px; max-width:92vw; height:100%; background:#fff; z-index:60; box-shadow:-4px 0 18px rgba(0,0,0,.3); transition:right .3s; display:flex; flex-direction:column; }
  .drawer.open { right:0; }
  .drawer header { background:#131921; color:#fff; padding:15px 18px; display:flex; justify-content:space-between; align-items:center; }
  .drawer header button { background:none; border:none; color:#fff; font-size:19px; cursor:pointer; }
  .c-items { flex:1; overflow-y:auto; padding:14px 18px; }
  .c-item { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid #eee; }
  .c-item img { width:62px; height:62px; object-fit:cover; border-radius:4px; }
  .c-item h5 { font-size:13.5px; line-height:1.3; }
  .c-item .row { display:flex; justify-content:space-between; align-items:center; margin-top:5px; }
  .qty button { width:24px; height:24px; border-radius:50%; border:1px solid #d5d9d9; background:#f0f2f2; cursor:pointer; }
  .drawer footer { padding:16px 18px; border-top:1px solid #ddd; }
  .drawer footer button { width:100%; background:#ffd814; border:1px solid #fcd200; border-radius:20px; padding:11px; font-size:14.5px; cursor:pointer; margin-top:9px; }
  .shade { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:55; display:none; }
  .shade.on { display:block; }
  footer.note { text-align:center; color:#565959; font-size:12.5px; padding:22px 14px 34px; }
  .empty { grid-column:1/-1; text-align:center; background:#fff; padding:44px; border-radius:4px; font-size:16px; }
</style>
</head>
<body>
<header class="top">
  <div class="logo" onclick="filterCat('All')">amazon<span>.clone</span></div>
  <div class="deliver">Deliver to<br><b>📍 Pakistan</b></div>
  <div class="searchbar">
    <select id="catSel" onchange="filterCat(this.value)">
      <option>All</option><option>Electronics</option><option>Fashion</option><option>Home</option><option>Sports</option>
    </select>
    <input id="q" placeholder="Search Amazon clone" oninput="render()">
    <button onclick="render()">🔍</button>
  </div>
  <div class="hlink">Hello, Ibrahim<br><b>Account &amp; Lists</b></div>
  <div class="hlink">Returns<br><b>&amp; Orders</b></div>
  <button class="cart" onclick="openCart()">🛒<b id="cartCount">0</b></button>
</header>
<nav class="sub" id="subnav">
  <button class="on" onclick="filterCat('All', this)">☰ All</button>
  <button onclick="filterCat('Electronics', this)">Electronics</button>
  <button onclick="filterCat('Fashion', this)">Fashion</button>
  <button onclick="filterCat('Home', this)">Home &amp; Kitchen</button>
  <button onclick="filterCat('Sports', this)">Sports</button>
  <button onclick="toast('Deals page is a demo here')">Today's Deals</button>
  <button onclick="toast('Best Sellers is a demo here')">Best Sellers</button>
</nav>

<div class="hero"><h1>Grand Sale — up to <span>60% off</span> top brands</h1></div>
<div class="grid" id="grid"></div>
<footer class="note">Demo store clone built by Ibrahim Khan for learning &amp; portfolio purposes. Not affiliated with Amazon.</footer>

<div class="shade" id="shade" onclick="closeCart()"></div>
<aside class="drawer" id="drawer">
  <header><b>🛒 Your Cart</b><button onclick="closeCart()">✕</button></header>
  <div class="c-items" id="cItems"></div>
  <footer>
    <div style="display:flex;justify-content:space-between;font-size:16px"><span>Subtotal</span><b id="cTotal">$0.00</b></div>
    <button onclick="checkout()">Proceed to Checkout</button>
  </footer>
</aside>

<script>
const products = [
  { id:1, name:'Wireless Noise-Cancelling Headphones — Bluetooth 5.3, 40H Battery', cat:'Electronics', price:59.99, was:129.99, rating:4.5, reviews:2314, img:'https://picsum.photos/seed/prod1/500/400' },
  { id:2, name:'Smart Watch Series 8 — Fitness Tracker, Heart Rate, AMOLED Display', cat:'Electronics', price:89.50, was:149.00, rating:4, reviews:1876, img:'https://picsum.photos/seed/prod2/500/400' },
  { id:3, name:'Men\'s Running Shoes — Lightweight, Breathable Mesh', cat:'Sports', price:45.00, was:79.99, rating:4.5, reviews:932, img:'https://picsum.photos/seed/prod3/500/400' },
  { id:4, name:'Stainless Steel Water Bottle 1L — Insulated, Leak Proof', cat:'Sports', price:16.95, was:24.95, rating:5, reviews:5402, img:'https://picsum.photos/seed/prod4/500/400' },
  { id:5, name:'Women\'s Summer Dress — Floral Print, Casual Fit', cat:'Fashion', price:29.99, was:54.99, rating:4, reviews:764, img:'https://picsum.photos/seed/prod5/500/400' },
  { id:6, name:'Leather Wallet for Men — RFID Blocking, Bifold', cat:'Fashion', price:21.49, was:39.99, rating:4.5, reviews:3120, img:'https://picsum.photos/seed/prod6/500/400' },
  { id:7, name:'Non-Stick Cookware Set — 10 Pieces, Dishwasher Safe', cat:'Home', price:74.99, was:119.99, rating:4.5, reviews:1287, img:'https://picsum.photos/seed/prod7/500/400' },
  { id:8, name:'LED Desk Lamp with USB Charging Port — 5 Brightness Levels', cat:'Home', price:24.99, was:42.99, rating:4, reviews:689, img:'https://picsum.photos/seed/prod8/500/400' },
  { id:9, name:'4K Action Camera — Waterproof, Wide Angle, WiFi', cat:'Electronics', price:119.00, was:199.00, rating:4.5, reviews:2054, img:'https://picsum.photos/seed/prod9/500/400' },
  { id:10, name:'Cricket Bat — English Willow, Professional Grade', cat:'Sports', price:139.99, was:189.99, rating:5, reviews:421, img:'https://picsum.photos/seed/prod10/500/400' },
  { id:11, name:'Ceramic Dinnerware Set — 16 Pieces, Service for 4', cat:'Home', price:49.95, was:79.95, rating:4.5, reviews:958, img:'https://picsum.photos/seed/prod11/500/400' },
  { id:12, name:'Bluetooth Speaker — Portable, Deep Bass, 24H Playtime', cat:'Electronics', price:35.99, was:69.99, rating:4.5, reviews:4210, img:'https://picsum.photos/seed/prod12/500/400' },
];
let cat = 'All';
let cart = {};
function stars(r){ const f = Math.floor(r); return '★★★★★'.slice(0,f) + (r % 1 ? '½' : '') + '☆☆☆☆☆'.slice(0, 5 - f - (r % 1 ? 1 : 0)); }
function money(n){ return '$' + n.toFixed(2); }
function render(){
  const q = document.getElementById('q').value.toLowerCase();
  const list = products.filter(p => (cat === 'All' || p.cat === cat) && p.name.toLowerCase().includes(q));
  document.getElementById('grid').innerHTML = list.length ? list.map(p => `
    <div class="p-card">
      <img src="${p.img}" alt="" onclick="toast('Product page is a demo here')">
      <h3 onclick="toast('Product page is a demo here')">${p.name}</h3>
      <div class="stars">${stars(p.rating)}<small>${p.reviews.toLocaleString()}</small></div>
      <div><span class="price"><sup>$</sup>${Math.floor(p.price)}<sup>${String(Math.round((p.price % 1) * 100)).padStart(2,'0')}</sup></span> <span class="was">${money(p.was)}</span></div>
      <div class="prime">✓prime <span style="color:#565959;font-style:normal;font-weight:400">FREE delivery tomorrow</span></div>
      <button onclick="addCart(${p.id})">Add to Cart</button>
    </div>`).join('') : '<div class="empty">No products match your search. Try another word.</div>';
}
function filterCat(c, btn){
  cat = c; document.getElementById('catSel').value = c === 'Home' ? 'Home' : c;
  if (btn) { document.querySelectorAll('#subnav button').forEach(b => b.classList.remove('on')); btn.classList.add('on'); }
  render();
}
function addCart(id){ cart[id] = (cart[id] || 0) + 1; updateCart(); toast('Added to cart'); }
function setQty(id, d){ cart[id] += d; if (cart[id] <= 0) delete cart[id]; updateCart(); }
function updateCart(){
  const ids = Object.keys(cart);
  document.getElementById('cartCount').textContent = ids.reduce((s, id) => s + cart[id], 0);
  const box = document.getElementById('cItems');
  box.innerHTML = ids.length ? ids.map(id => { const p = products.find(x => x.id == id); return `
    <div class="c-item"><img src="${p.img}" alt=""><div style="flex:1"><h5>${p.name}</h5>
    <div class="row"><span class="qty"><button onclick="setQty(${id},-1)">−</button> ${cart[id]} <button onclick="setQty(${id},1)">+</button></span><b>${money(p.price * cart[id])}</b></div></div></div>`; }).join('')
    : '<p style="color:#565959;text-align:center;padding:28px 0">Your cart is empty.</p>';
  document.getElementById('cTotal').textContent = money(ids.reduce((s, id) => s + products.find(x => x.id == id).price * cart[id], 0));
}
function openCart(){ document.getElementById('drawer').classList.add('open'); document.getElementById('shade').classList.add('on'); }
function closeCart(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('shade').classList.remove('on'); }
function checkout(){
  if (!Object.keys(cart).length) { toast('Cart is empty — add something first'); return; }
  cart = {}; updateCart(); closeCart(); toast('Order placed! (demo checkout — thank you)');
}
function toast(msg){
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#131921;color:#fff;padding:11px 18px;border-radius:8px;font-size:14px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.3)';
  document.body.appendChild(t); setTimeout(() => t.remove(), 2400);
}
render(); updateCart();
</script>
</body>
</html>
